<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandawkar Traders</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800" x-data="{ sidebarOpen: true }">

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="bg-slate-900 text-white flex flex-col transition-all duration-300"
            :class="sidebarOpen ? 'w-64' : 'w-20'">

            <!-- BRAND -->
            <div class="h-16 flex items-center justify-center border-b border-slate-800">
                <h1 class="font-bold text-xl tracking-wide text-blue-400" x-show="sidebarOpen">Mandawkar</h1>
                <h1 class="font-bold text-xl tracking-wide text-blue-400" x-show="!sidebarOpen">MT</h1>
            </div>

            <!-- MENU -->
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1 px-2">
                    <li>
                        <a href="/"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-speedometer2 text-xl text-blue-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/inventory"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-box-seam text-xl text-emerald-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Inventory</span>
                        </a>
                    </li>
                    <li>
                        <a href="/add-product"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-plus-circle text-xl text-purple-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Add Product</span>
                        </a>
                    </li>
                    <li>
                        <a href="/finance"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-wallet2 text-xl text-teal-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Finance</span>
                        </a>
                    </li>
                    <li>
                        <a href="/categories"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-tags text-xl text-yellow-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Categories</span>
                        </a>
                    </li>
                    <div class="border-t border-slate-800 my-2"></div>
                    <li>
                        <a href="/invoice"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-receipt text-xl text-rose-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Generate Bill</span>
                        </a>
                    </li>
                    <li>
                        <a href="/invoices"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-clock-history text-xl text-cyan-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">History</span>
                        </a>
                    </li>
                    <li>
                        <a href="/sales-report"
                            class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
                            <i class="bi bi-bar-chart text-xl text-indigo-400"></i>
                            <span class="ml-3 font-medium" x-show="sidebarOpen">Reports</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- USER -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                        {{ session.get('user')[0] | upper }}
                    </div>
                    <div class="ml-3" x-show="sidebarOpen">
                        <p class="text-sm font-medium">{{ session.get('user') }}</p>
                        <a href="/logout" class="text-xs text-slate-400 hover:text-white">Logout</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50">

            <!-- TOPBAR -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
                <button @click="sidebarOpen = !sidebarOpen"
                    class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <i class="bi bi-list text-2xl"></i>
                </button>
                <div class="text-sm text-gray-500">
                    Inventory Management System v3.0
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto p-6 scroll-smooth">
                {% block content %}{% endblock %}

                <footer class="mt-12 text-center text-gray-400 text-sm py-4">
                    Developed by Nakul Wadaskar
                </footer>
            </main>
        </div>
    </div>

</body>

</html>
