{% extends "base.html" %}
{% block content %}

<div class="max-w-2xl mx-auto">

  <!-- HEADER -->
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-800">Edit Product</h2>
    <p class="text-gray-500 text-sm">Update stock levels and pricing</p>
  </div>

  <!-- DETAILS CARD -->
  <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-200 flex items-center justify-between">
    <div>
      <h4 class="font-bold text-gray-800">{{ product[1] }} - {{ product[2] }}</h4>
      <p class="text-sm text-gray-500">{{ product[3] }} {{ product[4] }} {{ product[5] }}</p>
    </div>
    <div class="text-right">
      <span class="text-xs font-mono bg-white border border-gray-200 px-2 py-1 rounded">ID: {{ product[0] }}</span>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <form method="POST" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Quantity -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Current Quantity</label>
          <input name="quantity" type="number" value="{{ product[6] }}" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3 text-lg font-semibold bg-blue-50 text-blue-900 border-blue-200">
        </div>

        <!-- Price -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
          <input name="price" type="number" step="0.01" value="{{ product[8] }}" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Threshold -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Low Stock Threshold</label>
          <input name="threshold" type="number" value="{{ product[7] }}" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>
      </div>

      <div class="flex justify-end pt-6 space-x-3">
        <a href="/inventory"
          class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors">
          Cancel
        </a>
        <button type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:scale-105 flex items-center">
          <i class="bi bi-check-lg mr-2"></i> Update Product
        </button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
