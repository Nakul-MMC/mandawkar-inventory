{% extends "base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto">

  <!-- HEADER -->
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-800">Add New Product</h2>
    <p class="text-gray-500 text-sm">Enter product details to add to inventory</p>
  </div>

  <!-- FORM CARD -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <form method="POST" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Category -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
          <div class="relative">
            <select name="category" required
              class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2.5 px-3 appearance-none bg-gray-50 hover:bg-white transition-colors">
              {% for c in categories %}
              <option value="{{ c[1] }}">{{ c[1] }}</option>
              {% endfor %}
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
              <i class="bi bi-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <!-- Size -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Size</label>
          <input name="size" type="text" placeholder="e.g. 600x600"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Type -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <input name="type" type="text" placeholder="e.g. Ceramic"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Variant -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Variant</label>
          <input name="variant" type="text" placeholder="e.g. Glossy"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Pattern -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Pattern</label>
          <input name="pattern" type="text" placeholder="e.g. Marble"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <div class="col-span-1 md:col-span-2 border-t border-gray-100 my-2"></div>

        <!-- Quantity -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Initial Quantity</label>
          <input name="quantity" type="number" required placeholder="0"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Price -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
          <input name="price" type="number" step="0.01" required placeholder="0.00"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
        </div>

        <!-- Use Threshold -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Low Stock Alert Threshold</label>
          <input name="threshold" type="number" value="10" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-2 px-3">
          <p class="text-xs text-gray-400 mt-1">You will be notified when stock falls below this number.</p>
        </div>

      </div>

      <div class="flex justify-end pt-6">
        <button type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:scale-105 flex items-center">
          <i class="bi bi-plus-lg mr-2"></i> Save Product
        </button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
